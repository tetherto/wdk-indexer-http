name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g bare
      - run: npm run test:bare

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g bare
      - name: Install the packed tarball into a clean project
        run: |
          mkdir "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          cp test/package/smoke.js "$RUNNER_TEMP/pkg/"
          cp -r test/types "$RUNNER_TEMP/pkg/types"
          cd "$RUNNER_TEMP/pkg"
          npm init -y > /dev/null
          npm i --no-audit --no-fund ./tetherto-wdk-indexer-http-*.tgz
      - name: Smoke test on Node and Bare
        working-directory: ${{ runner.temp }}/pkg
        run: |
          node smoke.js
          bare smoke.js
      - name: Type-check against the installed package
        working-directory: ${{ runner.temp }}/pkg
        run: |
          npx -y -p typescript@5 tsc -p types
          npx -y -p typescript@5 tsc -p types/tsconfig.bundler.json

  integration:
    runs-on: ubuntu-latest
    env:
      WDK_INDEXER_API_KEY: ${{ secrets.WDK_INDEXER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g bare
      - run: npm run test:integration
      - run: npm run test:integration:bare
